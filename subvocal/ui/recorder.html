<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subvocal</title>
<style>
  :root {
    --bg: #f3efe7;
    --panel: #fbf8f2;
    --card: #fffdf9;
    --ink: #1f1c18;
    --muted: #857d71;
    --line: #e4ddd0;
    --accent: #2f6f62;
    --accent-ink: #ffffff;
    --rec: #d6452b;
    --meter-off: #ddd5c6;
    --shadow: 0 30px 60px -20px rgba(60, 45, 20, .25), 0 2px 6px rgba(60, 45, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141618;
      --panel: #1b1e21;
      --card: #23272b;
      --ink: #f1ece3;
      --muted: #9a9387;
      --line: #30353a;
      --accent: #5fb3a1;
      --accent-ink: #0f1a17;
      --rec: #f0644a;
      --meter-off: #353a40;
      --shadow: 0 30px 60px -20px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "SF Hebrew", "Arial Hebrew", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }

  /* ---------- buttons ---------- */
  button {
    font: inherit; border: 0; cursor: pointer; border-radius: 14px;
    padding: 14px 22px; font-size: 18px; font-weight: 600;
    transition: transform .08s ease, opacity .15s ease, background .15s ease;
  }
  button:active { transform: scale(.97); }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .ghost:hover { background: var(--panel); }
  button:disabled { opacity: .35; cursor: default; }
  kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px;
    padding: 1px 6px; color: var(--muted); background: var(--panel);
  }

  /* ---------- setup ---------- */
  #setup { align-items: center; justify-content: center; }
  .setup-box {
    width: min(460px, calc(100% - 32px)); background: var(--panel);
    border: 1px solid var(--line); border-radius: 24px; padding: 36px; box-shadow: var(--shadow);
  }
  .brand { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); direction: ltr; text-align: right; }
  h1 { font-size: 34px; margin: 6px 0 28px; font-weight: 700; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 18px 0 8px; }
  input, select {
    width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select { direction: ltr; font-size: 16px; }
  #startBtn { width: 100%; margin-top: 28px; font-size: 20px; padding: 16px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
  .error { color: var(--rec); font-size: 14px; min-height: 1.2em; margin-top: 10px; }

  /* ---------- session ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; gap: 16px;
  }
  .who { font-size: 15px; color: var(--muted); }
  .who b { color: var(--ink); font-weight: 600; }
  .rec { display: flex; align-items: center; gap: 14px; direction: ltr; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rec); animation: pulse 1.4s infinite; }
  .paused .dot { animation: none; opacity: .35; }
  @keyframes pulse { 50% { opacity: .3; } }
  .timer { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--muted); min-width: 48px; }
  .meter { display: flex; gap: 3px; align-items: flex-end; height: 22px; }
  .meter i { display: block; width: 5px; border-radius: 2px; background: var(--meter-off); transition: background .06s; }
  .meter i.on { background: var(--accent); }
  .meter i.hot { background: var(--rec); }

  main { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1600px; padding: 0 24px; }
  .card {
    position: relative; width: min(860px, 100%); min-height: min(52vh, 460px);
    background: var(--card); border-radius: 30px; box-shadow: var(--shadow);
    border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 56px; text-align: center;
    transform-style: preserve-3d; backface-visibility: hidden;
    transition: transform .2s cubic-bezier(.4, 0, .6, 1), opacity .2s;
  }
  .card.out-next { transform: rotateY(-90deg); }
  .card.in-next { transform: rotateY(90deg); transition: none; }
  .card.out-prev { transform: rotateY(90deg); }
  .card.in-prev { transform: rotateY(-90deg); transition: none; }
  .carrier { font-size: clamp(22px, 2.6vw, 34px); color: var(--muted); margin-bottom: 10px; min-height: 1.2em; }
  .text { font-size: clamp(56px, 10vw, 150px); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
  .card.sentence .text { font-size: clamp(34px, 4.6vw, 66px); font-weight: 600; line-height: 1.35; }
  .card-id { position: absolute; top: 18px; left: 24px; font-size: 13px; color: var(--muted); direction: ltr; font-variant-numeric: tabular-nums; }
  .card.pause .text { color: var(--muted); font-weight: 500; }

  footer { padding: 10px 28px 26px; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .25s ease; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; gap: 12px; }
  .count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 10px; }
  #nextBtn { min-width: 180px; }
  .hints { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .hints span { margin: 0 10px; white-space: nowrap; }

  /* ---------- overlays ---------- */
  .overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(6px); z-index: 5;
  }
  .overlay.on { display: flex; }
  .countdown { font-size: 180px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .dialog {
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 30px 32px;
    box-shadow: var(--shadow); width: min(420px, calc(100% - 32px));
  }
  .dialog h2 { margin: 0 0 8px; font-size: 24px; }
  .dialog p { margin: 0 0 22px; color: var(--muted); }
  .dialog .controls { justify-content: flex-start; }

  /* ---------- done ---------- */
  #done { align-items: center; justify-content: center; text-align: center; }
  .check {
    width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-size: 44px; margin: 0 auto 22px;
  }
  .stats { display: flex; gap: 14px; justify-content: center; margin: 26px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 22px; min-width: 120px; }
  .stat b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .path { direction: ltr; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); margin-bottom: 26px; }
</style>
</head>
<body>

<!-- ============ setup ============ -->
<section id="setup" class="screen on">
  <div class="setup-box">
    <div class="brand">Subvocal</div>
    <h1>הקלטה חדשה</h1>
    <label for="speaker">שם הדובר</label>
    <input id="speaker" autocomplete="off" placeholder="לדוגמה: דנה" autofocus>
    <label for="list">רשימת הקלטה</label>
    <select id="list"></select>
    <button id="startBtn" class="primary">התחלה</button>
    <div class="error" id="setupError"></div>
    <div class="note">המיקרופון פועל לאורך כל ההקלטה, מההתחלה ועד הסיום. אפשר לחזור לכרטיס ולקרוא אותו שוב.</div>
  </div>
</section>

<!-- ============ session ============ -->
<section id="session" class="screen">
  <header>
    <div class="who">דובר: <b id="whoName"></b></div>
    <div class="rec" id="recBox">
      <div class="dot"></div>
      <div class="timer" id="timer">0:00</div>
      <div class="meter" id="meter"></div>
    </div>
  </header>
  <main>
    <div class="card" id="card">
      <div class="card-id" id="cardId"></div>
      <div class="carrier" id="carrier"></div>
      <div class="text" id="text"></div>
    </div>
  </main>
  <footer>
    <div class="progress"><div id="bar"></div></div>
    <div class="row">
      <div class="count" id="count"></div>
      <div class="controls">
        <button class="ghost" id="prevBtn">→ הקודם</button>
        <button class="ghost" id="pauseBtn">הפסקה</button>
        <button class="primary" id="nextBtn">הבא ←</button>
      </div>
      <div><button class="ghost" id="endBtn">סיום</button></div>
    </div>
    <div class="hints">
      <span><kbd>רווח</kbd> / <kbd>←</kbd> הבא</span>
      <span><kbd>→</kbd> חזרה לכרטיס הקודם</span>
      <span><kbd>P</kbd> הפסקה</span>
      <span><kbd>Esc</kbd> סיום</span>
    </div>
  </footer>

  <div class="overlay" id="countOverlay"><div class="countdown" id="countNum">3</div></div>
  <div class="overlay" id="endOverlay">
    <div class="dialog">
      <h2>לסיים את ההקלטה?</h2>
      <p id="endText"></p>
      <div class="controls">
        <button class="primary" id="endYes">סיום ושמירה</button>
        <button class="ghost" id="endNo">המשך הקלטה</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ done ============ -->
<section id="done" class="screen">
  <div>
    <div class="check">✓</div>
    <h1 style="margin-bottom:4px">ההקלטה נשמרה</h1>
    <div class="who" id="doneWho"></div>
    <div class="stats">
      <div class="stat"><b id="doneSaved">0</b><span>כרטיסים נשמרו</span></div>
      <div class="stat"><b id="doneMissing">0</b><span>כרטיסים חסרים</span></div>
      <div class="stat"><b id="doneTime">0:00</b><span>משך ההקלטה</span></div>
    </div>
    <div class="path" id="donePath"></div>
    <div class="controls" style="justify-content:center">
      <button class="primary" id="againBtn">הקלטה חדשה</button>
      <button class="ghost" id="closeBtn">סגירה</button>
    </div>
  </div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok || data.error) throw new Error(data.error || r.statusText);
  return data;
};
const show = (id) => document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

let items = [], index = 0, paused = false, busy = false, active = false, poll = null;

// ---------- level meter ----------
const BARS = 14;
for (let i = 0; i < BARS; i++) {
  const b = document.createElement("i");
  b.style.height = `${6 + i * 1.2}px`;
  $("meter").appendChild(b);
}
function drawLevel(level) {
  // RMS to a 0..1 scale on a dB axis: -60 dB is empty, -10 dB is full.
  const db = 20 * Math.log10(Math.max(level, 1e-6));
  const n = Math.round(Math.min(1, Math.max(0, (db + 60) / 50)) * BARS);
  [...$("meter").children].forEach((b, i) => {
    b.className = i < n ? (i >= BARS - 2 ? "hot" : "on") : "";
  });
}

// ---------- setup ----------
async function loadConfig() {
  const cfg = await api("/api/config");
  $("list").innerHTML = "";
  for (const l of cfg.lists) {
    const o = document.createElement("option");
    o.value = l.path;
    o.textContent = `${l.path}  (${l.count})`;
    o.selected = l.path === cfg.default;
    $("list").appendChild(o);
  }
}

async function start() {
  const speaker = $("speaker").value.trim();
  if (!speaker) { $("setupError").textContent = "יש להזין את שם הדובר."; $("speaker").focus(); return; }
  $("setupError").textContent = "";
  $("startBtn").disabled = true;
  try {
    const res = await api("/api/start", {speaker, list: $("list").value});
    items = res.items;
    index = 0; paused = false; active = true;
    $("whoName").textContent = speaker;
    $("recBox").classList.remove("paused");
    show("session");
    poll = setInterval(updateStatus, 120);
    await countdown();
    render(0, null);
    api("/api/show", {index: 0});
  } catch (e) {
    $("setupError").textContent = "שגיאה: " + e.message;
  } finally {
    $("startBtn").disabled = false;
  }
}

function countdown() {
  return new Promise((resolve) => {
    let n = 3;
    $("countNum").textContent = n;
    $("countOverlay").classList.add("on");
    $("card").style.visibility = "hidden";
    const t = setInterval(() => {
      n -= 1;
      if (n === 0) {
        clearInterval(t);
        $("countOverlay").classList.remove("on");
        $("card").style.visibility = "";
        resolve();
      } else {
        $("countNum").textContent = n;
      }
    }, 800);
  });
}

async function updateStatus() {
  try {
    const s = await api("/api/status");
    if (!s.recording) return;
    $("timer").textContent = fmt(s.seconds);
    drawLevel(paused ? 0 : s.level);
  } catch (e) { /* the next poll tries again */ }
}

// ---------- cards ----------
function fill(i) {
  const it = items[i];
  $("card").classList.toggle("sentence", !it.carrier);
  $("card").classList.remove("pause");
  $("cardId").textContent = it.id;
  $("carrier").textContent = it.carrier;
  $("text").textContent = it.text;
  $("count").textContent = `${i + 1} מתוך ${items.length}`;
  $("bar").style.width = `${((i + 1) / items.length) * 100}%`;
  $("prevBtn").disabled = i === 0;
  $("nextBtn").textContent = i === items.length - 1 ? "סיום ✓" : "הבא ←";
}

function render(i, dir) {
  const card = $("card");
  if (!dir) { fill(i); return Promise.resolve(); }
  return new Promise((resolve) => {
    card.classList.add(dir === "next" ? "out-next" : "out-prev");
    setTimeout(() => {
      card.classList.remove("out-next", "out-prev");
      card.classList.add(dir === "next" ? "in-next" : "in-prev");
      fill(i);
      void card.offsetWidth; // apply the start angle before the transition
      card.classList.remove("in-next", "in-prev");
      resolve();
    }, 200);
  });
}

async function go(dir) {
  if (!active || busy || paused) return;
  if (dir === "next" && index === items.length - 1) { finish(); return; }
  if (dir === "prev" && index === 0) return;
  busy = true;
  index += dir === "next" ? 1 : -1;
  await render(index, dir);
  await api("/api/show", {index}).catch(() => {});
  busy = false;
}

async function togglePause() {
  if (!active || busy) return;
  paused = !paused;
  $("recBox").classList.toggle("paused", paused);
  $("pauseBtn").textContent = paused ? "המשך" : "הפסקה";
  if (paused) {
    await api("/api/pause", {}).catch(() => {});
    $("card").classList.add("pause");
    $("carrier").textContent = "";
    $("text").textContent = "הפסקה";
    $("cardId").textContent = "";
  } else {
    fill(index);
    await api("/api/show", {index}).catch(() => {});
  }
}

function askEnd() {
  if (!active) return;
  const left = items.length - index - 1;
  $("endText").textContent = left > 0 ? `נשארו עוד ${left} כרטיסים. ההקלטות שכבר בוצעו יישמרו.` : "כל הכרטיסים הוקלטו.";
  $("endOverlay").classList.add("on");
}

async function finish() {
  if (!active) return;
  active = false;
  $("endOverlay").classList.remove("on");
  clearInterval(poll);
  try {
    const res = await api("/api/finish", {});
    $("doneWho").textContent = `דובר: ${$("whoName").textContent}`;
    $("doneSaved").textContent = res.saved;
    $("doneMissing").textContent = res.missing.length;
    $("doneTime").textContent = fmt(res.seconds);
    $("donePath").textContent = res.folder;
  } catch (e) {
    $("donePath").textContent = "שגיאה בשמירה: " + e.message;
  }
  show("done");
}

// ---------- events ----------
$("startBtn").onclick = start;
$("speaker").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });
$("nextBtn").onclick = () => go("next");
$("prevBtn").onclick = () => go("prev");
$("pauseBtn").onclick = togglePause;
$("endBtn").onclick = askEnd;
$("endYes").onclick = finish;
$("endNo").onclick = () => $("endOverlay").classList.remove("on");
$("againBtn").onclick = () => { show("setup"); loadConfig(); $("speaker").focus(); };
$("closeBtn").onclick = () => { navigator.sendBeacon("/api/bye"); window.close(); };

document.addEventListener("keydown", (e) => {
  if (!$("session").classList.contains("on")) return;
  if ($("endOverlay").classList.contains("on")) {
    if (e.key === "Escape") $("endOverlay").classList.remove("on");
    if (e.key === "Enter") finish();
    return;
  }
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowLeft") { e.preventDefault(); go("next"); }
  else if (e.key === "ArrowRight" || e.key === "Backspace") { e.preventDefault(); go("prev"); }
  else if (e.key.toLowerCase() === "p" || e.key === "פ") togglePause();
  else if (e.key === "Escape") askEnd();
});

// Close the window: save the session and stop the server.
window.addEventListener("pagehide", () => navigator.sendBeacon("/api/bye"));

loadConfig().catch((e) => { $("setupError").textContent = "שגיאה: " + e.message; });
</script>
</body>
</html>
