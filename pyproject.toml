[project]
name = "subvocal"
version = "0.1.0"
description = "Speech aid for Hebrew speakers with a speech impairment"
requires-python = ">=3.10"
dependencies = [
    "phonikud",
    "phonikud-onnx",
    "faster-whisper",
    "sounddevice",
    "soundfile",
    "numpy",
    "soxr",
    "anthropic",
]

[project.optional-dependencies]
# Fine-tuning of the transcription model (LoRA). Install with: uv pip install -e ".[train]"
train = [
    "torch",
    "transformers",
    "peft",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["subvocal"]
